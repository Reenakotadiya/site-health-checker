name: Site Health Checker
description: Audit a website for accessibility (WCAG) problems, broken links, slow pages, redirect chains and missing titles.
author: Reena Kotadiya
branding:
  icon: activity
  color: green

inputs:
  url:
    description: Website to check, e.g. https://staging.example.com
    required: true
  max-pages:
    description: Maximum number of pages to crawl
    default: "100"
  min-score:
    description: Fail the step if the accessibility score is below this number (leave empty to skip)
    default: ""
  fail-on-problems:
    description: Fail the step on broken links or a low score. Set to "false" to only report.
    default: "true"
  comment-on-pr:
    description: On pull requests, post (and keep updated) one comment with the results. Needs "pull-requests write" permission.
    default: "true"
  upload-report:
    description: Save the HTML and JSON reports as a workflow artifact
    default: "true"
  artifact-name:
    description: Name of the uploaded artifact (change it if you run this action more than once in a workflow)
    default: site-health-report
  report-path:
    description: Where to save the HTML report
    default: site-health-report.html
  github-token:
    description: Token used to comment on pull requests
    default: ${{ github.token }}

outputs:
  accessibility-score:
    description: Site-wide accessibility score out of 100 (empty if the site could not be loaded)
    value: ${{ steps.summary.outputs.accessibility-score }}
  broken-links:
    description: Number of broken links found
    value: ${{ steps.summary.outputs.broken-links }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Site Health Checker
      shell: bash
      run: pip install --quiet "${{ github.action_path }}"

    - name: Check ${{ inputs.url }}
      id: check
      shell: bash
      env:
        URL: ${{ inputs.url }}
        MAX_PAGES: ${{ inputs.max-pages }}
        MIN_SCORE: ${{ inputs.min-score }}
        FAIL: ${{ inputs.fail-on-problems }}
        REPORT: ${{ inputs.report-path }}
      run: |
        args=("$URL" --max-pages "$MAX_PAGES" -o "$REPORT" --json site-health-results.json)
        [ -n "$MIN_SCORE" ] && args+=(--min-score "$MIN_SCORE")
        [ "$FAIL" = "false" ] && args+=(--no-fail)
        status=0
        site-health-checker "${args[@]}" || status=$?
        # Report and comment first; the final step fails the job if needed.
        echo "exit-code=$status" >> "$GITHUB_OUTPUT"

    - name: Summary and pull request comment
      id: summary
      if: always()
      shell: bash
      env:
        SHC_URL: ${{ inputs.url }}
        SHC_TOKEN: ${{ inputs.github-token }}
        SHC_COMMENT: ${{ inputs.comment-on-pr }}
      run: python -m site_health_checker.github_action site-health-results.json

    - name: Upload report
      if: always() && inputs.upload-report == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.report-path }}
          site-health-results.json
        if-no-files-found: ignore

    - name: Result
      shell: bash
      env:
        URL: ${{ inputs.url }}
        CODE: ${{ steps.check.outputs.exit-code }}
      run: |
        case "$CODE" in
          0) echo "Site Health Checker passed." ;;
          2) echo "::error::The website could not be loaded: $URL"; exit 2 ;;
          *) echo "::error::Site Health Checker found problems (broken links or a low accessibility score)."; exit "$CODE" ;;
        esac
