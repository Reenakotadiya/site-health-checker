name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: Try the CLI on a real website
        run: site-health-checker https://example.com --max-pages 5 --no-fail

      - name: Check the package builds for PyPI
        run: |
          pip install build
          python -m build

  github-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run this repo's GitHub Action
        id: health
        uses: ./
        with:
          url: https://example.com
          max-pages: "5"
          min-score: "90"

      - name: Check the action's outputs
        run: |
          echo "Score: ${{ steps.health.outputs.accessibility-score }}, broken links: ${{ steps.health.outputs.broken-links }}"
          test -n "${{ steps.health.outputs.accessibility-score }}"
          test -f site-health-report.html
