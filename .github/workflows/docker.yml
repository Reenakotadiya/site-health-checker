name: Docker

# Pushes and pull requests: build the image and smoke-test it.
# Releases (or the "Run workflow" button): publish multi-platform images to
# ghcr.io/reenakotadiya/site-health-checker with tags X.Y.Z, X and latest.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/reenakotadiya/site-health-checker
      PUBLISH: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and smoke-test
        run: |
          docker build -t site-health-checker:test .
          docker run --rm site-health-checker:test --version
          mkdir -p out
          # Must exit with 2 (site could not load), proving the CLI runs inside the container
          set +e; docker run --rm -v "$PWD/out:/reports" site-health-checker:test https://this-site-does-not-exist.invalid; code=$?; set -e
          test "$code" = "2"

      - name: Work out image tags
        if: env.PUBLISH == 'true'
        id: tags
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          major="${version%%.*}"
          echo "tags=$IMAGE:$version,$IMAGE:$major,$IMAGE:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: env.PUBLISH == 'true'

      - uses: docker/setup-buildx-action@v3
        if: env.PUBLISH == 'true'

      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish (amd64 + arm64)
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
