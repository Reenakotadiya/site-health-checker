# Check your live website every night and keep the report for 30 days.
# Copy this file to .github/workflows/nightly-site-health.yml in your repository.
name: Nightly site health

on:
  schedule:
    - cron: "30 1 * * *"   # every day at 01:30 UTC
  workflow_dispatch:        # plus a "Run workflow" button

jobs:
  site-health:
    runs-on: ubuntu-latest
    steps:
      - uses: Reenakotadiya/site-health-checker@v2
        with:
          url: https://www.example.com
          max-pages: "500"
          fail-on-problems: "false"   # just report; don't mark the run as failed
