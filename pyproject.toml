[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "site-health-checker"
version = "2.0.1"
description = "Audit any website for accessibility (WCAG) problems, broken links, slow pages, redirect chains and missing titles, with a plain-English HTML report."
readme = "README.md"
license = "MIT"
authors = [{ name = "Reena Kotadiya" }]
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]
keywords = ["accessibility", "a11y", "wcag", "broken-links", "link-checker", "website-audit", "qa", "testing", "seo"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
site-health-checker = "site_health_checker.cli:main"

[project.urls]
Homepage = "https://github.com/Reenakotadiya/site-health-checker"
Issues = "https://github.com/Reenakotadiya/site-health-checker/issues"

[tool.setuptools]
packages = ["site_health_checker"]
