[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "site-health-checker"
version = "1.0.0"
description = "Audit any website for broken links, slow pages, missing alt text, redirect chains and missing titles, with a clean HTML report."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Reena Kotadiya" }]
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]
keywords = ["broken-links", "link-checker", "website-audit", "qa", "testing", "seo", "accessibility"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
site-health-checker = "site_health_checker.cli:main"

[project.urls]
Homepage = "https://github.com/Reenakotadiya/site-health-checker"
Issues = "https://github.com/Reenakotadiya/site-health-checker/issues"

[tool.setuptools]
packages = ["site_health_checker"]
